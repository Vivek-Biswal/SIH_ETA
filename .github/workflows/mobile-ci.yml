name: Flutter Mobile CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/mobile/**'

jobs:
  test:
    # Keep rendering consistent with the reviewed Windows golden images.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Match the SDK used for the verified Android release and lockfile.
          flutter-version: '3.32.8'
          channel: stable

      - name: Install dependencies
        run: |
          cd apps/mobile/flutter_app
          flutter pub get

      - name: Analyze
        run: |
          cd apps/mobile/flutter_app
          flutter analyze

      - name: Run tests
        run: |
          cd apps/mobile/flutter_app
          flutter test
