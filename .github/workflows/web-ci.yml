name: Web App CI

on:
  push:
    branches: [main, develop]
    paths: ['apps/web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/web-ci.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/web_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/web_app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Focused passenger, map, simulation and analytics tests
        run: node --test tests/*.test.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build
