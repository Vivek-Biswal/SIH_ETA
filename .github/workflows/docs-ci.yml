name: Documentation

on:
  push:
    paths: ['README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'docs/**', 'scripts/check_docs.py', 'apps/**/README.md', 'backend/README.md']
  pull_request:
    paths: ['README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'docs/**', 'scripts/check_docs.py', 'apps/**/README.md', 'backend/README.md']

permissions:
  contents: read

jobs:
  links-and-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
